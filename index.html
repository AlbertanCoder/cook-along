<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shad's Cook Along</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
/* Layout idea: one big step card at a time, thumb-sized Back/Next pinned at the bottom, timers float above. */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --ink:#1d2420; --muted:#5d6a62; --line:#d9e0d8;
  --accent:#2f6b3a; --accent-ink:#ffffff; --heat:#b8432f; --tip:#fdf3d8; --tip-ink:#5a4510; --skill:#e3efe3;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121614; --surface:#1b211e; --ink:#e7ece8; --muted:#9aa89f; --line:#2c3530;
    --accent:#6cbf7a; --accent-ink:#0f1a12; --heat:#f08a72; --tip:#3a321c; --tip-ink:#f3dfa6; --skill:#20322a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1b211e; --ink:#e7ece8; --muted:#9aa89f; --line:#2c3530;
  --accent:#6cbf7a; --accent-ink:#0f1a12; --heat:#f08a72; --tip:#3a321c; --tip-ink:#f3dfa6; --skill:#20322a;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 var(--body)}
button,input,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:16px 16px 0}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:30px;font-weight:800}
h2{font-size:24px;font-weight:700}
h3{font-size:19px;font-weight:700}
.muted{color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px;margin:18px 0 24px}
.pick{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer}
.pick:hover{border-color:var(--accent)}
.pick .day{flex:none;width:58px;font-family:var(--display);font-weight:800;color:var(--accent);font-size:15px;text-transform:uppercase;letter-spacing:.04em}
.pick .name{font-weight:700;display:block}
.pick .sub{font-size:15px;color:var(--muted)}
.pick .go{margin-left:auto;font-size:22px;color:var(--muted)}
.pick.shop .day{color:var(--heat)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.home-btn{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:15px}
.count{margin-left:auto;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px;flex:1}
.step-text{font-size:24px;line-height:1.45;margin:10px 0 0}
.eyebrow{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.note{border-radius:12px;padding:12px 14px;margin-top:14px;font-size:17px}
.note.tip{background:var(--tip);color:var(--tip-ink)}
.note.skill{background:var(--skill)}
.timer-btn{margin-top:18px;display:inline-flex;align-items:center;gap:8px;border:2px solid var(--accent);background:none;color:var(--accent);border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer}
.need{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:4px}
.need label,.shop-row label{display:flex;gap:12px;align-items:flex-start;cursor:pointer;padding:6px 0}
.need input,.shop-row input{width:22px;height:22px;flex:none;margin-top:3px;accent-color:var(--accent)}
.need .got span,.shop-row.got .what{color:var(--muted);text-decoration:line-through}
.nav{position:sticky;bottom:0;display:flex;gap:10px;padding:14px 0 18px;background:linear-gradient(transparent, var(--bg) 30%)}
.nav button{flex:1;border-radius:14px;padding:16px;font-size:20px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--surface)}
.nav .next{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);flex:2}
.nav button:disabled{opacity:.4;cursor:default}
.timers{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.t{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:8px 12px;font-size:16px}
.t b{font-variant-numeric:tabular-nums;font-size:22px;min-width:64px}
.t .lbl{flex:1}
.t button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:14px}
.t.ring{border-color:var(--heat);background:var(--tip);color:var(--tip-ink)}
.t.ring b{color:var(--heat)}
.shop-group{margin:18px 0 6px;font-family:var(--display);font-size:18px}
.shop-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.shop-row .p{text-align:right;font-variant-numeric:tabular-nums;font-size:16px}
.shop-row .p small{display:block;font-size:12px;color:var(--muted)}
.have{font-size:13px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 10px;cursor:pointer;white-space:nowrap}
.have.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.shop-row.owned .what{color:var(--muted);text-decoration:line-through}
.totals{display:flex;gap:10px;margin:14px 0}
.totals div{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.totals b{display:block;font-size:24px;font-variant-numeric:tabular-nums;font-family:var(--display)}
.totals span{font-size:14px;color:var(--muted)}
.small{font-size:15px}
.today,.fridge{background:var(--surface);border:2px solid var(--accent);border-radius:16px;padding:14px 16px;margin-top:14px;display:flex;flex-direction:column;gap:8px}
.fridge{border-width:1px;border-color:var(--line)}
.today p,.fridge p{margin:0}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cook-now,.solid{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);border-radius:12px;padding:9px 14px;cursor:pointer;font-size:16px}
.linkish{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:700;cursor:pointer;text-align:left;font-size:16px}
.chip{display:inline-block;margin-left:8px;font-size:12px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 8px;vertical-align:2px}
.chip.warn{background:var(--tip);color:var(--tip-ink);border:1px solid currentColor}
.chip.bad{background:var(--heat);color:#fff}
.item{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .what{flex:1 1 200px}
.item .what b{display:block}
.item .what span{font-size:15px;color:var(--muted)}
.item .what span.warn{color:var(--tip-ink);background:var(--tip);padding:0 6px;border-radius:6px}
.item .what span.bad{color:var(--heat);font-weight:700}
.item button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:14px}
.addform{display:grid;gap:8px;padding-top:6px}
.addform input,.addform select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
.addform .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.addform label{font-size:14px;color:var(--muted);display:grid;gap:4px}
.scale{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px;display:flex;flex-direction:column;gap:10px}
.scale p{margin:0}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:24px;font-weight:700;cursor:pointer;flex:none}
.stepper input{width:110px;text-align:center;font-size:22px;font-weight:700;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px;font-variant-numeric:tabular-nums}
.stepper .unit{font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;cursor:pointer;font-size:15px;text-align:left;line-height:1.3}
.seg button b{display:block;font-size:16px}
.seg button.on{border-color:var(--accent);background:var(--skill)}
.opt{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.opt input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--accent)}
.term{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-decoration:underline dotted 2px;text-decoration-color:var(--accent);text-underline-offset:5px;cursor:pointer}
.term:hover,.term.on{color:var(--accent)}
.next-up{margin:18px 0 0;padding-top:12px;border-top:1px dashed var(--line)}
.swipe-hint{text-align:center;font-size:13px;color:var(--muted);margin:6px 0 0}
.done-mark{font-size:44px;line-height:1}
@media (max-width:420px){ .step-text{font-size:21px} .pick .day{width:48px} }
@media (prefers-reduced-motion: reduce){ .bar i{transition:none} }
/* 2-week planner additions: bigger buttons, pan labels, day cards, tabs */
.tabs{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 0 14px;background:linear-gradient(transparent, var(--bg) 25%);margin-top:auto}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 4px;font-size:16px;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.big-go{display:block;width:100%;background:var(--accent);color:var(--accent-ink);border:0;border-radius:16px;padding:20px;font-size:24px;font-weight:800;font-family:var(--display);cursor:pointer;margin-top:6px}
.meal{display:grid;grid-template-columns:76px 1fr;gap:4px 10px;align-items:baseline}
.meal .lbl{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.meal .val b{font-size:19px}
.meal .val span{display:block;font-size:15px;color:var(--muted)}
.dayc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:8px 0;display:flex;flex-direction:column;gap:8px}
.dayc.today-c{border:2px solid var(--accent)}
.dayc .dh{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;font-size:15px}
.dayc .dh .chip{margin-left:auto}
.notes{display:flex;flex-direction:column;gap:6px}
.notes p{margin:0;font-size:15px;background:var(--tip);color:var(--tip-ink);border-radius:10px;padding:8px 10px}
.weekh{margin:22px 0 4px;display:flex;flex-direction:column;gap:2px}
.weekh span{font-size:15px;color:var(--muted)}
.pans{display:inline-block;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--skill);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:3px 12px;margin-left:8px;vertical-align:2px}
.temp{margin-top:14px;border:2px solid var(--heat);border-radius:12px;padding:10px 14px;font-size:18px;font-weight:700;color:var(--heat)}
.smoke{margin-top:12px;border-radius:12px;padding:10px 14px;font-size:16px;background:var(--bg);border:1px dashed var(--muted)}
.watch{display:inline-flex;align-items:center;gap:8px;margin-top:14px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:10px 16px;font-weight:700;text-decoration:none;color:var(--accent);font-size:16px}
.nav.cook .next{font-size:26px;padding:22px}
.portion-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.portion-seg button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 6px;font-size:18px;font-weight:700;cursor:pointer}
.portion-seg button.on{border-color:var(--accent);background:var(--skill)}
.left-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.left-grid button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 0;font-size:22px;font-weight:800;cursor:pointer}
.left-grid button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px}
.sheet button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:17px;cursor:pointer}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.facts span{font-size:14px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--bg)}
details.chg{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details.chg summary{cursor:pointer;font-weight:700}
details.chg ul{margin:8px 0 0;padding-left:20px;font-size:16px}
.src{font-size:15px}
.src a{color:var(--accent);font-weight:700}
.status{font-size:12px;display:block;color:var(--muted)}
.status.guess{color:var(--tip-ink)}
.warnbox{border:2px solid var(--heat);border-radius:14px;padding:10px 14px;margin:10px 0;color:var(--heat);font-weight:700}
.wtabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.wtabs button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;font-weight:700;cursor:pointer;font-size:16px;line-height:1.25}
.wtabs button.on{border-color:var(--accent);background:var(--skill)}
.qty{font-size:14px;color:var(--muted);display:block}
</style>
</head>

const RICE_STEPS = (rice, water) => [
  {pan:"Rice pot", t:"Weigh {" + rice + " g} of rice into a bowl. Cover it with cold water, swish it with your hand and pour the cloudy water off. Do that 3 times, then tip the rice into the sieve and shake it well.", why:"Rinsing washes off loose starch, so the grains don't glue together.", watch:"rice"},
  {pan:"Rice pot", t:"Put the empty pot on the kitchen scale and press zero. Tip in the rinsed rice. Press zero again, then pour in cold water until the scale says {" + water + " g}.", why:"This is the fix for wet rice. Rinsed rice already holds some water, so it needs less than the usual amount. Weighing makes it exact every time."},

/* ---------- dates ---------- */
function keyOf(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function parseKey(k){ const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); }
function addDays(k, n){ const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); }
function diffDays(a, b){ return Math.round((parseKey(b) - parseKey(a)) / 86400000); }
function wk(k){ return parseKey(k).toLocaleDateString("en-CA", {weekday:"short"}); }
function dayLabel(k){ return parseKey(k).toLocaleDateString("en-CA", {weekday:"short", day:"numeric", month:"short"}); }

const R_BY = id => RECIPES.find(r => r.id === id);
// Eat-by: cooked meat 3 days after the cook day (the 3–4 day rule, low end), fish 2.
function keepDays(r){ return r.fish ? 2 : 3; }

function freshPlanState(){
  return {start: PLAN_START, cooks: PLAN.map(c => ({r:c.r, p:c.p, extra:c.extra || null, sauce:c.sauce || null, left:null, done:null})),
          skips:[], force:[], bought:{}, have:{}, got:{}};
}

/* Walk the 14 days. Lunch = oldest leftover. Dinner = cook the next dish only when no leftovers are left
   (or when you asked to cook that night). Leftovers never get served past their eat-by date. */
function buildPlan(st){
  const cooks = st.cooks, placed = cooks.map(() => null), pool = [], warn = [], days = [];
  const dates = []; for (let i = 0; i < PLAN_LEN; i++) dates.push(addDays(st.start, i));
  const nextQ = () => cooks.findIndex((c, i) => !placed[i] && !c.done);
  const take = () => {
    pool.sort((a, b) => a.by < b.by ? -1 : a.by > b.by ? 1 : a.ci - b.ci);
    const it = pool.find(x => x.n > 0); if (!it) return null;
    it.n--; return {kind:"left", ci:it.ci, r:cooks[it.ci].r, by:it.by};
  };
  const expire = d => pool.forEach(it => { if (it.n > 0 && it.by < d) { warn.push({ci:it.ci, n:it.n, by:it.by}); it.n = 0; } });
  const place = (ci, d) => {
    placed[ci] = d;
    const c = cooks[ci], r = R_BY(c.r);
    const left = c.left != null ? c.left : Math.max(0, c.p - 1);
    pool.push({ci, n:left, by:addDays(d, keepDays(r))});
    return {kind:"cook", ci, r:c.r};
  };
  for (const d of dates) {
    expire(d);
    const lunch = take() || {kind:"none"};
    let dinner;
    const doneHere = cooks.findIndex((c, i) => !placed[i] && c.done === d);
    if (doneHere >= 0) dinner = place(doneHere, d);
    else if (st.skips.includes(d)) dinner = take() || {kind:"off"};
    else {
      const have = pool.reduce((s, x) => s + x.n, 0), q = nextQ();
      if (q >= 0 && (have === 0 || st.force.includes(d))) dinner = place(q, d);
      else dinner = take() || {kind:"none"};
    }
    days.push({date:d, lunch, dinner});
  }
  // done cooks outside the 14 days still count as placed
  cooks.forEach((c, i) => { if (!placed[i] && c.done) placed[i] = c.done; });
  const end = addDays(st.start, PLAN_LEN);
  const after = pool.filter(x => x.n > 0).map(x => ({ci:x.ci, n:x.n, by:x.by, ok: x.by >= end}));
  return {days, placed, warn, after};
}

function weekIndex(st, d){ const n = Math.floor(diffDays(st.start, d) / 7); return n >= 0 && n <= 1 ? n : (n < 0 ? 0 : null); }
// Which weekly shop buys the food for a cook. Once a shop is ticked as done, its list is locked.
function weekOfCook(st, plan, ci){
  for (const w of [0, 1]) if (st.bought[w] && st.bought[w].includes(ci)) return w;
  const d = plan.placed[ci]; if (!d) return null;
  let w = weekIndex(st, d); if (w === null) return null;
  while (w <= 1 && st.bought[w]) w++;
  return w <= 1 ? w : null;
}
function shopDate(st, w){ return addDays(st.start, 7*w); }

/* Shopping list for week w: total of every cook bought that week, rounded up to whole packs.
   Bags and bottles that keep carry over from week 1, so week 2 only buys what's missing. */
function shopList(st, plan, w){
  const need = [{}, {}];
  st.cooks.forEach((c, ci) => {
    const cw = weekOfCook(st, plan, ci); if (cw === null) return;
    const r = R_BY(c.r), f = c.p / r.base;
    r.buy.forEach(([id, q]) => { need[cw][id] = (need[cw][id] || 0) + q*f; });
    if (c.sauce) R_BY(c.sauce).buy.forEach(([id, q]) => { need[cw][id] = (need[cw][id] || 0) + q; });
  });
  need[0].thermometer = 1;
  const rows = [];
  const carry = {};
  for (let wk_ = 0; wk_ <= w; wk_++) {
    Object.keys(ITEMS).forEach(id => {
      const it = ITEMS[id];
      let q = need[wk_][id] || 0;
      if (!q) return;
      if (it.once && wk_ > 0) return;
      const spare = carry[id] || 0;
      const useSpare = it.keeps ? Math.min(spare, q) : 0;
      q -= useSpare; carry[id] = spare - useSpare;
      let packs = 0, cost = 0, buyQty = 0;
      if (q > 1e-9) {
        if (it.bulk) { buyQty = Math.ceil(q/50)*50; cost = buyQty/1000*it.price; }
        else { packs = Math.ceil(q/it.packQty - 1e-9); buyQty = packs*it.packQty; cost = packs*it.price; }
        if (it.keeps && !(st.have[wk_ + ":" + id])) carry[id] = (carry[id] || 0) + (buyQty - q);
      }
      if (wk_ === w) rows.push({id, it, need:need[wk_][id], fromSpare:useSpare, packs, buyQty, cost});
    });
  }
  return rows;
}
// A price stops counting as "checked" once the flyer it came from has ended.
function priceStatus(it, onDate){ if (it.status !== "checked") return "guess"; if (it.validTo && onDate > it.validTo) return "guess"; return "checked"; }
function shopTotal(st, plan, w){
  const rows = shopList(st, plan, w);
  let total = 0, left = 0, checked = 0;
  rows.forEach(x => { if (x.it.home && !st.have[w + ":" + x.id + ":need"]) return; if (st.have[w + ":" + x.id]) return;
    total += x.cost; if (!st.got[w + ":" + x.id]) left += x.cost; if (priceStatus(x.it, shopDate(st, w)) === "checked") checked += x.cost; });
  return {total, left, checked, rows};
}
// $ per bowl: what the food in one bowl costs at the listed prices (spices and oil not counted).
function bowlCost(r){
  let c = 0, chk = 0;
  r.buy.forEach(([id, q]) => { const it = ITEMS[id]; const unit = it.bulk ? it.price/1000 : it.price/it.packQty; c += q*unit; if (it.status === "checked") chk += q*unit; });
  return {per: c / r.base, checkedShare: c ? chk / c : 0};
}
// Protein per bowl from Canadian Nutrient File values.
function proteinPerBowl(r){ return (r.nut || []).reduce((s, [code, g]) => s + CNF[code].p * g / 100, 0); }

/* Reminders that belong to a day: thaw, marinate, freeze leftovers before their eat-by. */
function dayNotes(st, plan){
  const notes = {};
  const add = (d, t) => { (notes[d] = notes[d] || []).push(t); };
  st.cooks.forEach((c, ci) => {
    const d = plan.placed[ci]; if (!d || c.done) return;
    const r = R_BY(c.r), w = weekOfCook(st, plan, ci);
    if (r.ahead) add(d, r.ahead);
    if (!r.meat || w === null) return;
    const it = ITEMS[r.meat], sd = shopDate(st, w), gap = diffDays(sd, d);
    if (it.frozen) add(addDays(d, -1), "Tonight: move the " + r.meatLabel + " for tomorrow's " + r.short.toLowerCase() + " from the freezer to the fridge to thaw.");
    else if (gap >= 2) add(addDays(d, -1), "This morning: move the " + r.meatLabel + " for tomorrow's " + r.short.toLowerCase() + " from the freezer to the fridge to thaw.");
  });
  plan.warn.forEach(x => add(addDays(x.by, 0) < st.start ? st.start : x.by, "Freeze " + x.n + " portion" + (x.n === 1 ? "" : "s") + " of " + R_BY(st.cooks[x.ci].r).short.toLowerCase() + " today. The plan can't fit them in before their eat-by date."));
  return notes;
}
// Meat that should go in the freezer on shop day (cooked 2+ days after the shop).
function freezeAtShop(st, plan, w){
  const out = [];
  st.cooks.forEach((c, ci) => {
    if (weekOfCook(st, plan, ci) !== w || c.done) return;
    const r = R_BY(c.r), d = plan.placed[ci]; if (!r.meat || !d) return;
    const it = ITEMS[r.meat], f = c.p / r.base, amt = (r.buy.find(b => b[0] === r.meat) || [0, 0])[1] * f;
    if (it.frozen) out.push("Salmon for " + wk(d) + ": straight into the freezer.");
    else if (diffDays(shopDate(st, w), d) >= 2) out.push(Math.round(amt) + " g " + r.meatLabel + " for " + wk(d) + " " + parseKey(d).getDate() + ": freezer, in a flat bag with the date on it.");
  });
  return out;
}

const GRX = new RegExp(GLOSS.map(g => "(" + g[0] + ")").join("|"), "gi");
function gloss(h){

    const k = g.slice(0, GLOSS.length).findIndex(x => x !== undefined);
    if (k < 0 || used.has(k)) return m;

/* ---------- scaling ---------- */
const FR8 = ["","⅛","¼","⅜","½","⅝","¾","⅞"];
function niceNum(v, unit){
  const u = (unit || "").toLowerCase();
  if (/^(g|ml|kg)\b/.test(u)) return String(v < 1000 ? Math.max(5, Math.round(v/5)*5) : Math.round(v/10)*10);
  if (/\bcans?\b/.test(u)) return String(Math.max(1, Math.round(v)));
  const spoon = /^(cups?|tbsp|tsp)\b/.test(u);
  const wholeOnly = /(potato|tomato|egg|clove|fillet|portion|onions$|cucumber)/.test(u);
  const step = spoon ? (v < 1 ? 8 : v < 4 ? 4 : v < 10 ? 2 : 1) : (wholeOnly || v >= 10 ? 1 : 2);
  let r = Math.round(v*step)/step; if (r <= 0) r = 1/step;
  const whole = Math.floor(r), frac = Math.round((r - whole)*8);
  return { v:r, s:(whole ? String(whole) : "") + FR8[frac] };
}
function singular(unit){
  const parts = unit.split(" "); let w = parts.pop();
  if (/oes$/.test(w)) w = w.slice(0,-2); else if (/[^s]s$/.test(w)) w = w.slice(0,-1);
  parts.push(w); return parts.join(" ");
}
function qty(base, unit, f){
  const n = niceNum(base*f, unit);
  if (typeof n === "string") return n + " " + unit;
  if (!unit) return n.s;
  return n.s + " " + (n.v <= 1 && !/^(tbsp|tsp|g|ml)$/i.test(unit) ? singular(unit) : unit);
}
function fill(text, c){
  return text.replace(/\{(P|R|[\d.]+)(?: ([^}]+))?\}/g, (m, num, unit) => {
    if (num === "P") return String(c.P);
    if (num === "R") return String(c.R);
    const u = unit || "";
    if (/\bcans?\b/.test(u)) { const n = Math.max(1, Math.round(parseFloat(num)*c.f)); return n + " " + (n === 1 ? singular(u) : u); }
    return qty(parseFloat(num), u, c.f);
  });
}
function portionsFor(r, ci){ if (ci != null && ST().cooks[ci]) return ST().cooks[ci].p; return S.libP[r.id] || r.base; }
function ctxFor(r, ci){ const p = r.sauce || r.extra ? r.base : portionsFor(r, ci); return {f: p / r.base, P:p, R:Math.max(0, p-1)}; }

// Loud alarm: square-wave beeps, repeated every 2 seconds until you tap OK, plus vibration where the phone allows it.
function beep(){
  try {
    if (!audio) return;
    [0, 0.3, 0.6, 0.9].forEach(d => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = "square"; o.frequency.value = d % 0.6 ? 1175 : 880; o.connect(g); g.connect(audio.destination);
      g.gain.setValueAtTime(0.6, audio.currentTime + d);
      g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + d + 0.25);
      o.start(audio.currentTime + d); o.stop(audio.currentTime + d + 0.26);
    });
  } catch (e) {}
  try { if (navigator.vibrate) navigator.vibrate([400, 150, 400, 150, 400]); } catch (e) {}
}
function startTimer(spec){
  try {
    if (navigator.audioSession) navigator.audioSession.type = "playback"; // lets iPhone play the alarm with the silent switch on
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
  } catch (e) {}
  timers.push({id: Date.now() + Math.random(), label: spec.label, end: Date.now() + spec.min*60000, then: spec.then || "", next: spec.next || null, rung:0});
  renderTimers();
}
function renderTimers(){
  const box = document.getElementById("timers");
  if (!box) return;
  box.innerHTML = "";
  timers.forEach(tm => {
    const left = (tm.end - Date.now())/1000;
    const d = el("div", "t" + (left <= 0 ? " ring" : ""));
    d.innerHTML = left <= 0 ? "<b>Done</b><span class=\"lbl\"><strong>" + esc(tm.label) + "</strong>" + (tm.then ? ": " + esc(tm.then) : "") + "</span>"
                            : "<b>" + fmt(left) + "</b><span class=\"lbl\">" + esc(tm.label) + "</span>";
    if (left <= 0 && tm.next) d.append(btn("", "Start " + tm.next.min + " min", () => { timers = timers.filter(x => x !== tm); startTimer(tm.next); }));
    d.append(btn("", left <= 0 ? "OK" : "Cancel", () => { timers = timers.filter(y => y !== tm); renderTimers(); }));
    box.append(d);
  });
}
setInterval(() => {
  let ring = false;
  const now = Date.now();
  timers.forEach(tm => { if (tm.end <= now && (!tm.rung || now - tm.rung >= 2000)) { tm.rung = now; ring = true; } });

}, 500);

function fridgeStatus(it){
  const age = diffDays(it.date, todayKey());
  const verb = it.thawed ? "thawed" : it.raw ? "raw, in since" : "made";
  const when = age <= 0 ? verb + " today" : age === 1 ? verb + " yesterday" : verb + " " + age + " days ago";
  const left = it.keep - age;
  if (left < 0) return {when, cls:"bad", msg:"Past its eat-by date. Toss it."};
  if (left === 0) return {when, cls:"warn", msg: it.raw ? "Cook or freeze today" : "Eat today or toss it"};
  if (left === 1) return {when, cls:"warn", msg: it.raw ? "Cook or freeze by tomorrow" : "Eat by tomorrow"};
  return {when, cls:"", msg:(it.raw ? "Cook or freeze by " : "Eat by ") + dayLabel(addDays(it.date, it.keep))};
}

  app.append(el("p", "muted small", "A new dish only gets cooked when the leftovers run out. Tap Swap on any day to trade dishes, cook early, or take a night off. Leftovers never go past their eat-by date."));
  const sr = el("div", "btnrow");
  sr.append(el("span", "small", "Starts " + esc(dayLabel(st.start))));
  sr.append(btn("ghost", "Start a day later", () => { st.start = addDays(st.start, 1); save(); render(); }));
  if (st.start > PLAN_START) sr.append(btn("ghost", "Earlier", () => { st.start = addDays(st.start, -1); save(); render(); }));
  app.append(sr);
  PL.days.forEach((day, k) => {
    if (k % 7 === 0) {
      const w = k / 7, t = shopTotal(st, PL, w);
      const h = el("div", "weekh", "<h2>Week " + (w+1) + (w ? " · a bit harder" : " · easy") + "</h2><span>Shop " + esc(dayLabel(shopDate(st, w))) + " · about " + money(t.total) + "</span>");
      h.append(btn("linkish", "Open the week " + (w+1) + " list ›", () => go({screen:"shop", w})));
      app.append(h);
    }
    const d = day.date, card = el("div", "dayc" + (d === tk ? " today-c" : ""));
    const head = el("div", "dh", esc(dayLabel(d)) + (d === tk ? "<span class=\"chip\">Today</span>" : ""));
    card.append(head);
    card.append(mealRow("Lunch", day.lunch, d));
    card.append(mealRow("Dinner", day.dinner, d));
    if (day.dinner.kind === "cook") {
      const c = st.cooks[day.dinner.ci], r = R_BY(c.r);
      if (c.extra) card.append(el("p", "small", "<strong>" + esc(c.extra) + "</strong>"));
      if (!c.done) card.append(portionSeg(day.dinner.ci, render));
    }
    const nn = notes[d] || [];
    if (nn.length) { const nb = el("div", "notes"); nn.forEach(n => nb.append(el("p", "", esc(n)))); card.append(nb); }
    const row = el("div", "btnrow");
    if (day.dinner.kind === "cook") row.append(btn("cook-now", "Open recipe", () => go({screen:"recipe", id:st.cooks[day.dinner.ci].r, i:0, ci:day.dinner.ci})));
    row.append(btn("ghost", "Swap", () => { openSheet = openSheet === d ? null : d; render(); }));
    card.append(row);
    if (openSheet === d) card.append(swapSheet(d, day));
    app.append(card);
  });
  const later = st.cooks.map((c, i) => ({c, i})).filter(x => !PL.placed[x.i]);
  if (later.length) app.append(el("p", "muted small", "Pushed past the 2 weeks (not on any shopping list): " + esc(later.map(x => R_BY(x.c.r).short).join(", ")) + "."));
  if (PL.after.length) app.append(el("p", "muted small", "Left over at the end: " + esc(PL.after.map(x => x.n + " × " + R_BY(st.cooks[x.ci].r).short.toLowerCase() + " (eat by " + dayLabel(x.by) + ")").join(", ")) + "."));
  app.append(btn("home-btn", "Reset the whole plan", () => { if (S.confirmReset) { S.p2 = freshPlanState(); delete S.confirmReset; } else S.confirmReset = true; save(); render(); }));
  if (S.confirmReset) app.append(el("p", "small", "Tap again to really reset (cooked meals and ticks are cleared)."));
  app.append(tabs("plan"));
  renderTimers();
}

/* ---------- shop ---------- */
function renderShop(){
  keepAwake(false);
  app.innerHTML = "";
  app.append(timerBox());
  const st = ST();
  let w = view.w;
  if (w !== 0 && w !== 1) w = diffDays(st.start, todayKey()) >= 6 ? 1 : 0;
  app.append(el("h1", "", "Shopping list"));
  const wt = el("div", "wtabs");
  [0, 1].forEach(k => { const t = shopTotal(st, PL, k); wt.append(btn(k === w ? "on" : "", "Week " + (k+1) + " · " + dayLabel(shopDate(st, k)) + " · " + money(t.total), () => go({screen:"shop", w:k}))); });
  app.append(wt);
  const t = shopTotal(st, PL, w), sd = shopDate(st, w);
  app.append(el("div", "totals", "<div><b>" + money(t.total) + "</b><span>this shop</span></div><div><b>" + money(t.left) + "</b><span>still to grab</span></div>"));
  const pct = t.total ? Math.round(t.checked / t.total * 100) : 0;
  app.append(el("p", "small", "Target $100–200 a week, $200 at most. " + pct + "% of this total is from prices checked in Edmonton flyers or store websites on " + PRICE_DATE + "; the rest are guesses." + (sd > "2026-11-11" ? " This week's flyers end 11 Nov, so check the new ones (Flipp app: No Frills, Superstore) before this shop." : "")));
  if (t.total > 200) app.append(el("div", "warnbox", "Over the $200 cap. Tap “have it” on anything at home, or swap a dish for a cheaper one."));
  const fz = freezeAtShop(st, PL, w);
  const spare = t.rows.filter(x => x.it.freezes && x.buyQty - x.need + 0 > 1 && !x.fromSpare).map(x => Math.round(x.buyQty - (x.need - x.fromSpare)) + " g spare " + x.it.name.split(",")[0].toLowerCase() + ": freezer, it's for week 2.");
  if (fz.length || spare.length) { const b = el("div", "note tip", "<strong>Freeze on shop day:</strong><br>" + fz.concat(w === 0 ? spare : []).map(esc).join("<br>")); app.append(b); }
  const groups = {};
  t.rows.forEach(x => { (groups[x.it.g] = groups[x.it.g] || []).push(x); });
  Object.keys(groups).forEach(g => {
    app.append(el("div", "shop-group", esc(g)));
    groups[g].forEach(x => {
      const id = x.id, k = w + ":" + id, it = x.it;
      const home = it.home && !st.have[k + ":need"];
      const own = home || st.have[k];
      const got = st.got[k];
      const row = el("div", "shop-row" + (got ? " got" : "") + (own ? " owned" : ""));
      const amount = x.packs || x.buyQty ? (it.bulk ? "about " + (x.buyQty >= 1000 ? (x.buyQty/1000).toFixed(2) + " kg" : x.buyQty + " g") : (x.packs + " × " + (it.packQty === 1 ? "" : "pack"))) : "";
      const uses = (x.fromSpare ? "covered partly by last week's leftover · " : "") + (x.packs === 0 && !it.bulk ? "already covered by last week's pack" : "");
      const left = el("div", "", "<label><input type=\"checkbox\"" + (got ? " checked" : "") + "><span class=\"what\">" + esc(it.name) + "<span class=\"qty\">" + esc((amount ? "Buy: " + amount.replace(/ × $/, "") : "") + (uses ? (amount ? " · " : "") + uses : "")) + "</span></span></label>");
      left.querySelector("input").addEventListener("change", e => { st.got[k] = e.target.checked; save(); renderShop(); });
      if (it.home) left.append(btn("have" + (home ? " on" : ""), home ? "have it" : "need it", () => { st.have[k + ":need"] = !st.have[k + ":need"]; save(); renderShop(); }));
      else left.append(btn("have" + (st.have[k] ? " on" : ""), "have it", () => { st.have[k] = !st.have[k]; save(); renderShop(); }));
      const ps = priceStatus(it, sd);
      row.append(left, el("div", "p", money(x.cost) + "<span class=\"status " + ps + "\">" + (ps === "checked" ? "checked: " + esc(it.seen || "") : "guess") + "</span>"));
      app.append(row);
    });
  });
  app.append(el("p", "muted small", "Not counted: spices (cumin, chili powder, paprika, oregano, cayenne, garlic and onion powder, chili flakes), avocado oil, hot sauce, salsa. Read labels: broth, tomatoes, salsa, mayo and hot sauce can hide sugar (sriracha and sweet chili sauce have it; plain hot sauces like Frank's or Cholula usually don't, but check). Low-sodium where you can."));
  const done = !!st.bought[w];
  app.append(btn(done ? "ghost" : "solid", done ? "Undo: I haven't done this shop" : "I've done this shop", () => {
    if (done) delete st.bought[w];
    else st.bought[w] = st.cooks.map((c, ci) => ci).filter(ci => weekOfCook(st, PL, ci) === w);
    save(); renderShop();
  }));
  if (done) app.append(el("p", "small muted", "Locked: if the plan moves around now, this week's food stays bought."));
  app.append(btn("home-btn", "Clear this week's ticks", () => { Object.keys(st.got).forEach(k => { if (k.startsWith(w + ":")) delete st.got[k]; }); save(); renderShop(); }));
  app.append(tabs("shop"));
  renderTimers();
}

/* ---------- recipes ---------- */
function recipeFacts(r){
  const f = [];
  if (r.time) f.push(r.time + " min");
  if (r.main) { f.push(money(bowlCost(r).per) + " a bowl"); f.push("about " + Math.round(proteinPerBowl(r)) + " g protein"); }
  if (r.cuisine) f.push(r.cuisine);
  return f;
}
function renderRecipes(){
  keepAwake(false);
  app.innerHTML = "";
  app.append(timerBox());
  app.append(el("h1", "", "Recipes"));
  app.append(el("p", "muted small", "Every recipe is from a well-rated cook, changed for no sugar, less salt, no shellfish and more protein. Open one to see the source and every change."));
  const sec = (title, list) => {
    app.append(el("div", "shop-group", esc(title)));
    const box = el("div", "list");
    list.forEach(r => {
      const b = el("button", "pick"); b.type = "button";
      b.innerHTML = "<span><span class=\"name\">" + esc(r.name) + "</span><span class=\"sub\">" + esc(recipeFacts(r).join(" · ")) + "</span><span class=\"sub\">From " + esc(r.source.who) + "</span></span><span class=\"go\" aria-hidden=\"true\">›</span>";
      b.addEventListener("click", () => go({screen:"recipe", id:r.id, i:0}));
      box.append(b);
    });
    app.append(box);
  };
  sec("Dinners", RECIPES.filter(r => r.main));
  sec("Sauces (make ahead, no stove)", RECIPES.filter(r => r.sauce));
  app.append(el("p", "small muted", "The 4th sauce, the no-sugar teriyaki-style sauce, is made inside the chicken stir-fry."));
  sec("Use it up", RECIPES.filter(r => r.extra));
  app.append(el("p", "muted small", "Protein numbers are worked out from the Canadian Nutrient File (Health Canada) for the amounts in one bowl. $ per bowl uses the prices on the shopping list."));
  app.append(tabs("recipes"));
  renderTimers();
}

/* ---------- cook mode ---------- */
function cookFor(r){
  // which plan cook a finished recipe counts as: the one you opened, or tonight's, or the next one of the same dish
  const st = ST();
  if (view.ci != null && st.cooks[view.ci] && st.cooks[view.ci].r === r.id) return view.ci;
  const tk = todayKey();
  let ci = st.cooks.findIndex((c, i) => c.r === r.id && !c.done && PL.placed[i] === tk);
  if (ci < 0) ci = st.cooks.findIndex(c => c.r === r.id && !c.done);
  return ci < 0 ? null : ci;
}
function renderRecipe(){
  const r = R_BY(view.id);
  if (!r) return go({screen:"home"});
  const total = r.steps.length + 2;
  const i = Math.min(Math.max(view.i || 0, 0), total - 1);
  const ci = view.ci != null && ST().cooks[view.ci] ? view.ci : null;
  const c = ctxFor(r, ci);
  app.innerHTML = "";
  const top = el("div", "top");
  top.append(btn("home-btn", "‹ Back", () => go({screen: view.from || "home"})));
  top.append(el("span", "count", i === 0 ? "Get ready" : (i === total - 1 ? "Finished" : "Step " + i + " of " + r.steps.length)));
  app.append(top);
  keepAwake(true);
  const bar = el("div", "bar", "<i style=\"width:" + Math.round(i/(total-1)*100) + "%\"></i>");
  bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax", String(total-1)); bar.setAttribute("aria-valuenow", String(i));
  app.append(bar);
  app.append(timerBox());
  const card = el("div", "card");
  if (i === 0) {
    card.append(el("div", "eyebrow", esc(fill(r.sub, c))));
    card.append(el("h2", "", esc(r.name)));
    card.append(el("div", "facts", recipeFacts(r).map(x => "<span>" + esc(x) + "</span>").join("")));
    card.append(el("p", "src", "From <a href=\"" + esc(r.source.url) + "\" target=\"_blank\" rel=\"noopener\">" + esc(r.source.who) + ": " + esc(r.source.title) + "</a> · " + esc(r.source.rating)));
    if (r.main) {
      card.append(el("p", "eyebrow", "How many portions?"));
      if (ci != null) card.append(portionSeg(ci, renderRecipe));
      else { const seg = el("div", "portion-seg"); [2,4,6].forEach(n => seg.append(btn(portionsFor(r) === n ? "on" : "", n + " portions", () => { S.libP[r.id] = n; save(); renderRecipe(); }))); card.append(seg); }
      card.append(el("p", "small muted", "Leftovers: eat within " + keepDays(r) + " days (" + (r.fish ? "fish" : "cooked meat") + "). The plan never puts one later than that."));
      if (ci != null && ST().cooks[ci].extra) card.append(el("div", "note skill", esc(ST().cooks[ci].extra)));
      if (ci != null && ST().cooks[ci].sauce) card.append(btn("linkish", "Make the " + R_BY(ST().cooks[ci].sauce).name.toLowerCase() + " first ›", () => go({screen:"recipe", id:ST().cooks[ci].sauce, i:0})));
    }
    if (r.ahead) card.append(el("div", "note tip", esc(r.ahead)));
    const ch = el("details", "chg", "<summary>What I changed from the original (" + r.changes.length + ")</summary><ul>" + r.changes.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>");
    card.append(ch);
    card.append(el("p", "muted small", "Get these out on the counter. Tick each one."));
    const ul = el("ul", "need");
    r.need.forEach((n, k) => {
      const id = "need_" + r.id + "_" + k;
      const li = el("li", S[id] ? "got" : "");
      li.innerHTML = "<label><input type=\"checkbox\"" + (S[id] ? " checked" : "") + "><span>" + esc(fill(n, c)) + "</span></label>";
      li.querySelector("input").addEventListener("change", e => { S[id] = e.target.checked; save(); li.className = e.target.checked ? "got" : ""; });
      ul.append(li);
    });
    card.append(ul);
  } else if (i === total - 1) {
    card.append(el("div", "done-mark", "✓"));
    card.append(el("h2", "", "Done. Enjoy it."));
    card.append(el("div", "note skill", "<strong>Skill you just practised:</strong> " + esc(r.skill)));
    if (r.main) {
      const pci = cookFor(r);
      const box = el("div", "scale");
      const cook = pci != null ? ST().cooks[pci] : null;
      const cur = cook && cook.left != null ? cook.left : null;
      box.append(el("label", "eyebrow", "How many portions are left in containers?"));
      const grid = el("div", "left-grid");
      for (let n = 0; n <= 6; n++) grid.append(btn(cur === n ? "on" : "", String(n), () => {
        const tk = todayKey();
        if (cook) { cook.left = n; if (!cook.done) cook.done = tk; }
        addToFridge(r.short, n, cook ? cook.done : tk, keepDays(r), cook ? "cook" + pci + r.id : "lib" + r.id + tk);
        save(); replan(); renderRecipe();
      }));
      box.append(grid);
      if (cur != null) {
        const by = addDays(cook.done, keepDays(r));
        box.append(el("p", "", "<strong>Saved.</strong> " + cur + " portion" + (cur === 1 ? "" : "s") + " in the fridge, eat by " + esc(dayLabel(by)) + ". The plan and shopping list have been updated."));
      } else box.append(el("p", "small muted", "Tap the number. The next days move around to fit, and the shopping list shrinks if you made extra."));
      card.append(box);
    }
    card.append(el("p", "muted small", "Fridge within an hour. Reheat once, until steaming hot."));
  } else {
    const st = r.steps[i-1];
    card.innerHTML = "<div class=\"eyebrow\">Step " + i + "<span class=\"pans\">" + esc(st.pan) + "</span></div><p class=\"step-text\">" + gloss(esc(fill(st.t, c))) + "</p>";
    const def = el("div", "note skill"); def.hidden = true; def.setAttribute("aria-live", "polite"); card.append(def);
    card.addEventListener("click", e => {
      const t = e.target.closest(".term"); if (!t) return;
      const g = GLOSS[Number(t.dataset.k)];
      card.querySelectorAll(".term.on").forEach(x => x.classList.remove("on"));
      if (!def.hidden && def.dataset.k === t.dataset.k) { def.hidden = true; return; }
      t.classList.add("on"); def.dataset.k = t.dataset.k;
      def.innerHTML = "<strong>" + esc(g[1]) + ":</strong> " + esc(g[2]); def.hidden = false;
    });
    if (st.temp) card.append(el("div", "temp", "🌡 Done at " + esc(st.temp) + " in the thickest part"));
    if (st.smoke) card.append(el("div", "smoke", "<strong>Smoke check:</strong> fan on high? If the pan smokes hard, turn it down a notch. A light haze is fine."));
    if (st.timer) {
      const mins = st.timer.min === 1.5 ? "1½ min" : st.timer.min + " min";
      card.append(btn("timer-btn", "Start " + mins + " timer: " + st.timer.label, () => startTimer(st.timer)));
    }
    if (st.why) card.append(el("div", "note tip", "<strong>Why:</strong> " + gloss(esc(fill(st.why, c)))));
    if (st.watch && VIDEOS[st.watch]) {
      const v = VIDEOS[st.watch];
      const a = el("a", "watch", "▶ Watch how: " + esc(v.what) + " · " + esc(v.who) + " (" + esc(v.len) + ")");
      a.href = "https://www.youtube.com/watch?v=" + v.id; a.target = "_blank"; a.rel = "noopener";
      card.append(a);
    }
    if (i < r.steps.length) {
      const nx = r.steps[i];
      const tx = fill(nx.t, c);
      card.append(el("p", "next-up small muted", "<strong>Next (" + esc(nx.pan) + "):</strong> " + esc(tx.length > 90 ? tx.slice(0, 88).replace(/\s+\S*$/, "") + "…" : tx)));
    } else card.append(el("p", "next-up small muted", "<strong>Next:</strong> that's the last step. Tap Finish."));
  }
  app.append(card);
  const nav = el("div", "nav cook");
  const back = btn("", "Back", () => go(Object.assign({}, view, {i:i-1}))); back.disabled = i === 0;
  const next = btn("next", i === 0 ? "Start cooking" : (i === total - 2 ? "Finish" : (i === total - 1 ? "Back to today" : "Next")),
    () => i === total - 1 ? go({screen:"home"}) : go(Object.assign({}, view, {i:i+1})));
  nav.append(back, next); app.append(nav);
  if (i === 0) app.insertBefore(el("p", "swipe-hint", "Tap any underlined word for a plain explanation. The screen stays on while a recipe is open. Swipe left for Next."), nav);
  renderTimers();
}

/* ---------- gestures ---------- */
let tx = null, ty = null;
document.addEventListener("touchstart", e => { if (view.screen !== "recipe" || e.target.closest("input,label,button,select,a,summary")) { tx = null; return; } tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
document.addEventListener("touchend", e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  if (dx < 0) document.querySelector(".nav .next")?.click();
  else { const b = document.querySelector(".nav button"); if (b && !b.disabled) b.click(); }
}, {passive:true});
document.addEventListener("keydown", e => {
  if (view.screen !== "recipe" || e.target.closest("input,select")) return;
  if (e.key === "ArrowRight") document.querySelector(".nav .next")?.click();
  if (e.key === "ArrowLeft") { const b = document.querySelector(".nav button"); if (b && !b.disabled) b.click(); }
});

if (S.view && ["plan","shop","recipes"].includes(S.view.screen)) view = S.view;
else if (S.view && S.view.screen === "recipe" && R_BY(S.view.id)) view = S.view;
render();
</script>
</body>
</html>
